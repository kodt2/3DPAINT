# 3DPAINT dev stack.
# Environment variables are read from .env in the repository root
# (run `docker compose` from the repo root; see .env.example).
services:
  web:
    build:
      context: ../legacy/monolith
    container_name: login_reg_web
    # The app migrates the DB on startup; restart until PostgreSQL is ready.
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=login_reg_db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Jwt__Key=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpiryMinutes=60
      - Minio__Endpoint=storage:9000
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
      - Minio__BucketName=${MINIO_BUCKET}
      - Minio__Region=${MINIO_REGION}
      - Minio__UseSsl=false
    depends_on:
      - db
      - storage
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: login_reg_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  storage:
    # S3-compatible object storage (SeaweedFS in dev, ADR 0009).
    # S3 API listens on 9000, Filer UI on 8888.
    image: chrislusf/seaweedfs:4.54
    container_name: login_reg_storage
    command: server -s3 -s3.port=9000 -dir=/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8888:8888"
    volumes:
      - miniodata:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  miniodata:
