# 3DPAINT dev stack.
# Environment variables are read from infra/.env
# (Docker Compose v5 reads .env from the compose file directory).
# Public ports: gateway only (127.0.0.1:${WEB_PORT:-8080}) and S3 (127.0.0.1);
# the monolith is internal. Network (LAN) access goes through the Caddy TLS
# edge instead of publishing the gateway: infra/compose.https.yml + the
# `https` profile (step H, ADR 0016, BIND_ADDR).
services:
  gateway:
    build:
      context: ../services/gateway
    ports:
      # Loopback only: LAN access is the `https` profile's job (Caddy,
      # ADR 0016), not a published HTTP port.
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Upstream__Monolith=http://web:8080
      # nginx build by default; the `dev` profile (make up-dev) switches it
      # to the Vite dev server for HMR.
      - Upstream__Frontend=${FRONTEND_UPSTREAM:-http://frontend:80}
      - MaxUploadBytes=${MAX_UPLOAD_BYTES:-104857600}
      # The host port the gateway is published on: the default allowed Origin
      # for the CSRF check is http://localhost:{WEB_PORT} (ADR 0011).
      - WEB_PORT=${WEB_PORT:-8080}
      # Comma-separated allowed Origins for the CSRF check (empty = the
      # default above). Deploy: set your public domain, e.g.
      # PUBLIC_ORIGIN=https://3dpaint.example.com (see README, «Деплой на сервер»).
      # The dev profile (infra/compose.dev.yml) adds the Vite origin.
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      # Login/register rate limit (in-memory sliding window per client, ADR 0011):
      # default 10 requests per 60 seconds. Raise for the test stand if needed;
      # the defaults are intentionally conservative.
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-}
      # Trusted proxies (comma-separated IPs) / networks (comma-separated CIDRs)
      # allowed to identify the real client via X-Forwarded-For. Empty by
      # default: the client key is always the direct socket peer.
      - KNOWN_PROXIES=${KNOWN_PROXIES:-}
      - KNOWN_NETWORKS=${KNOWN_NETWORKS:-}
    depends_on:
      - web
      - frontend
    restart: unless-stopped
    networks:
      - app-network

  # One-shot monolith DB migration (step 4.3a, AGENTS.md §5): applies the EF
  # migrations BEFORE the web process starts; the web container itself never
  # migrates anymore. Carries only the connection string (the `migrate`
  # command is handled before the JWT/JWKS/Minio validation in Program.cs).
  monolith-migrate:
    build:
      context: ../legacy/monolith
    restart: "no"
    depends_on:
      # One-shot: it must not race a fresh Postgres (the web container used to
      # retry via restart; a one-shot with restart:"no" would just die).
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    # The image ENTRYPOINT is [dotnet, LoginAndReg.dll]: the command is
    # appended to it (same pattern as auth-migrate).
    command: ["migrate"]
    networks:
      - app-network

  web:
    build:
      context: ../legacy/monolith
    # Migrations run in monolith-migrate (see above); restart until
    # PostgreSQL is ready.
    restart: unless-stopped
    # No published ports: reachable only inside app-network (via gateway).
    environment:
      # The monolith environment is overridable via infra/.env: local dev runs
      # it in Development so the SPA API client can pull the OpenAPI document
      # (npm run gen:api); production-like stacks keep the Production default.
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Jwt__Key=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpiryMinutes=60
      # Clock skew for JWT lifetime validation, both schemes (step 4.3a).
      - Jwt__ClockSkewSeconds=${JWT_CLOCK_SKEW_SECONDS:-30}
      # RS256 tokens from the Auth service are validated against its JWKS
      # (step 4.3a, ADR 0018). Issuer/audience reuse the Auth values so the
      # signing and validating sides can never drift apart. JWKS is fetched
      # lazily — a down Auth service does not block startup or /api/health.
      - AuthJwks__Url=${MONOLITH_JWKS_URL:-http://auth:8080/.well-known/jwks.json}
      - AuthJwks__Issuer=${AUTH_JWT_ISSUER:-3dpaint.auth}
      - AuthJwks__Audience=${AUTH_JWT_AUDIENCE:-3dpaint}
      - AuthJwks__RequireHttps=${MONOLITH_JWKS_REQUIRE_HTTPS:-false}
      - AuthJwks__RefreshThrottleSeconds=${MONOLITH_JWKS_REFRESH_THROTTLE_SECONDS:-30}
      - Minio__Endpoint=storage:9000
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
      - Minio__BucketName=${MINIO_BUCKET}
      - Minio__Region=${MINIO_REGION}
      - Minio__UseSsl=false
      # Presigned URLs are signed with this endpoint so the browser can use them (TD-3).
      - PUBLIC_S3_ENDPOINT=${PUBLIC_S3_ENDPOINT:-http://localhost:${S3_PUBLIC_PORT:-9000}}
      # Single upload limit shared with the Gateway (ADR 0015).
      - MaxUploadBytes=${MAX_UPLOAD_BYTES:-104857600}
      # Accepted upload extensions (comma-separated, step 4.0). Single source
      # of truth: the server-side validation AND the public /api/config read
      # this same value, so the SPA and the server can never disagree. Default
      # is .glb (the SPA viewer is GLB-only).
      - AllowedUploadExtensions=${ALLOWED_UPLOAD_EXTENSIONS:-.glb}
    depends_on:
      db:
        condition: service_started
      storage:
        condition: service_started
      # Migrations must have finished before the web process starts (step 4.3a).
      monolith-migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  # SPA (nginx). The Gateway serves it under /spa/** (prefix stripped) and
  # /assets/** (hashed build assets, immutable caching) — see ADR 0011.
  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    networks:
      - app-network

  # Vite dev server for HMR. Enabled only with: make up-dev (profile `dev`).
  # In that mode the Gateway routes /spa/** to this service instead of nginx.
  frontend-dev:
    image: node:20.19.5-alpine3.22
    profiles: ["dev"]
    # Run as the host user (UID/GID from the shell or infra/.env) so anything
    # written through the /app bind mount belongs to the developer, not root.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ../frontend:/app
      # node_modules lives in a named volume, never on the host bind mount:
      # the host tree stays clean (no root-owned leftovers) and the npm cache
      # survives container restarts. Ownership is fixed by
      # vite-node-modules-init (infra/compose.dev.yml, make up-dev).
      - vite-node-modules:/app/node_modules
    environment:
      # base "/" (not /spa/): the user opens http://localhost:5173/spa/**
      # directly (Vite SPA-fallback serves index.html) AND the Gateway route
      # /spa/** strips the prefix before forwarding, so Vite must expect
      # unprefixed paths.
      - GATEWAY_URL=http://gateway:8080
      # Container-local HOME: the npm cache must never land on a bind mount.
      - HOME=/tmp
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev"]
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Same pattern as auth-db: lets the one-shot monolith-migrate wait for a
    # ready server on a cold start (fresh volumes).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - app-network

  storage:
    # S3-compatible object storage (SeaweedFS in dev, ADR 0009).
    # S3 API listens on 9000, Filer UI on 8888 (dev convenience, 127.0.0.1 only).
    # The S3 port is published on 127.0.0.1 so the browser can use presigned URLs
    # directly (TD-3); CORS origins are configured via S3_CORS_ORIGINS.
    image: chrislusf/seaweedfs:4.54
    # CORS: the SPA fetches presigned URLs from JS (viewer, step 3c.3), so
    # every origin the SPA can be served from needs to be listed here:
    # the gateway (8080, 18080 fallback), the Vite dev server (5173) and the
    # e2e gateway (18090), each via localhost and 127.0.0.1.
    command: server -s3 -s3.port=9000 -s3.allowedOrigins=${S3_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:18080,http://127.0.0.1:18080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:18090,http://127.0.0.1:18090} -dir=/data
    ports:
      - "127.0.0.1:${S3_PUBLIC_PORT:-9000}:9000"
      - "127.0.0.1:${S3_FILER_PORT:-8888}:8888"
    volumes:
      - miniodata:/data
    networks:
      - app-network

  # --- Auth Service (step 4.1, ADR 0018) ----------------------------------
  # Standalone auth: its own PostgreSQL instance + user + database, one-shot
  # init / keygen / migrate containers (migrations never run inside the
  # service), RS256 signing keys in a named volume (never the image or repo).
  # Internal only: NO published port here (the e2e stand, infra/compose.e2e.yml,
  # exposes it directly). Not yet routed by the Gateway (step 4.2+).

  auth-db:
    # Dedicated PostgreSQL for the Auth service (its own database + user).
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - app-network

  # One-shot: idempotently ensure the `auth` database exists. This is the
  # explicit db-init step (AGENTS.md) and guards a reused volume.
  auth-initdb:
    image: postgres:15-alpine
    restart: "no"
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${AUTH_DB_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ "$$(psql -h auth-db -U auth -tAc "SELECT 1 FROM pg_database WHERE datname='auth'")" != "1" ]; then
          psql -h auth-db -U auth -c "CREATE DATABASE auth OWNER auth"
          echo "auth-initdb: created database 'auth'"
        else
          echo "auth-initdb: database 'auth' already present"
        fi
    networks:
      - app-network

  # One-shot: generate the RS256 signing keys (current + previous) into the
  # auth-keys volume when missing. Dev convenience — Production should provide
  # the keys from a secret; the service fails fast if the current key is absent.
  auth-keygen:
    build:
      context: ../services/auth
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Not used by keygen (no DB access); present so the builder's required
      # connection-string check passes.
      ConnectionStrings__AuthConnection: Host=localhost;Port=5432;Database=auth;Username=auth;Password=auth
      Jwt__CurrentKeyFile: /keys/current.pem
      Jwt__PreviousKeyFile: /keys/previous.pem
      Jwt__RsaKeySize: "2048"
    volumes:
      - auth-keys:/keys
    # The image ENTRYPOINT is [dotnet, Auth.dll]: the command is appended to it.
    command: ["keygen"]
    networks:
      - app-network

  # One-shot: apply the EF Core migrations and seed the default role, AFTER the
  # database exists and BEFORE the service starts. The service itself never
  # migrates (AGENTS.md §5).
  auth-migrate:
    build:
      context: ../services/auth
    restart: "no"
    depends_on:
      auth-initdb:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AuthConnection: Host=auth-db;Port=5432;Database=auth;Username=auth;Password=${AUTH_DB_PASSWORD}
    # The image ENTRYPOINT is [dotnet, Auth.dll]: the command is appended to it.
    command: ["migrate"]
    networks:
      - app-network

  auth:
    build:
      context: ../services/auth
    restart: unless-stopped
    # No published ports: internal only (the e2e stand exposes it directly).
    depends_on:
      auth-db:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      auth-keygen:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__AuthConnection: Host=auth-db;Port=5432;Database=auth;Username=auth;Password=${AUTH_DB_PASSWORD}
      Jwt__Issuer: ${AUTH_JWT_ISSUER:-3dpaint.auth}
      Jwt__Audience: ${AUTH_JWT_AUDIENCE:-3dpaint}
      Jwt__ExpiryMinutes: ${AUTH_JWT_EXPIRY_MINUTES:-15}
      Jwt__CurrentKeyFile: /keys/current.pem
      Jwt__PreviousKeyFile: /keys/previous.pem
    volumes:
      - auth-keys:/keys
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    # Pinned subnet (step H, ADR 0016): the https profile pins Caddy to the
    # fixed address 172.28.0.10 on this network and sets the gateway's
    # KNOWN_PROXIES to exactly that IP, so the rate-limit client key is
    # taken from X-Forwarded-For only for connections from Caddy. The
    # values must stay in sync with infra/compose.https.yml.
    # Parameterized (step 4.0) so the throwaway E2E/HTTPS stands can use a
    # different /16 and run alongside the main stack without a network-pool
    # overlap; the main stack keeps the 172.28.0.0/16 default.
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.28.0.0/16}

volumes:
  pgdata:
  miniodata:
  # Vite/npm for the dev profile; mounted at /app/node_modules in frontend-dev
  # so the host bind mount ../frontend stays free of node_modules leftovers.
  vite-node-modules:
  # Auth service (step 4.1): its own PostgreSQL data and the RS256 signing keys
  # (the keys are generated into /keys by auth-keygen, never baked into the
  # image or committed).
  auth-db-data:
  auth-keys:
