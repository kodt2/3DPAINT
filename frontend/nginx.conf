server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets: the file name changes with the content,
    # so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: a stale index.html points to
    # hashed assets that are no longer in the new build.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: unknown paths serve index.html, and React Router
    # (basename /spa) takes over client-side.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
